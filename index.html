<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Stock Lookup">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111214" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>Stock Lookup</title>
<style>
:root{
  --bg:#f4f4f6; --card:#ffffff; --text:#16171a; --muted:#6b6f78; --line:#e3e4e8;
  --accent:#1f5eff; --accent-text:#ffffff; --eoss:#d92d20; --eoss-bg:#fdecea;
  --pc:#b54708; --pc-bg:#fff4e5; --ok:#067647; --input:#ffffff;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#111214; --card:#1b1c20; --text:#f1f2f4; --muted:#9a9ea8; --line:#2c2e34;
    --accent:#5b8cff; --accent-text:#0b0c0e; --eoss:#ff6b5e; --eoss-bg:#3a1a17;
    --pc:#ffb35c; --pc-bg:#3a2a14; --ok:#4ade80; --input:#232429;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Hiragino Sans","Apple SD Gothic Neo",system-ui,sans-serif;
  font-size:16px;line-height:1.4}
body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.wrap{max-width:560px;margin:0 auto;padding:6px 16px 40px}
header{display:flex;align-items:center;justify-content:space-between;margin:0 0 6px;gap:8px}
header h1{font-size:18px;margin:0;font-weight:700;letter-spacing:-.2px}
.hdr-r{display:flex;align-items:center;gap:4px}
.lang{display:flex;background:var(--line);border-radius:9px;padding:2px;gap:2px}
.lang button{border:0;background:transparent;color:var(--muted);font-size:12px;font-weight:600;padding:4px 8px;border-radius:7px}
.lang button.on{background:var(--card);color:var(--text)}
.iconbtn{border:0;background:transparent;color:var(--muted);font-size:14px;padding:6px;border-radius:10px}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--line);border-radius:12px;padding:3px;gap:3px;margin-bottom:8px}
.tabs button{border:0;background:transparent;color:var(--muted);font-size:15px;font-weight:600;padding:7px 0;border-radius:10px}
.tabs button.on{background:var(--card);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.search{display:flex;gap:8px;margin-bottom:8px}
.search input{flex:1;min-width:0;font-size:18px;padding:9px 12px;border:1px solid var(--line);border-radius:12px;background:var(--input);color:var(--text);outline:none}
.search input:focus{border-color:var(--accent)}
.btn{border:0;border-radius:12px;padding:0 16px;font-size:16px;font-weight:600;background:var(--accent);color:var(--accent-text);white-space:nowrap}
.btn.ghost{background:var(--card);color:var(--text);border:1px solid var(--line)}
.btn.wide{width:100%;padding:14px}
.card{background:var(--card);border-radius:16px;padding:12px;border:1px solid var(--line);margin-bottom:12px}
.imgbox{background:#fff;border-radius:12px;aspect-ratio:1/.9;display:flex;align-items:center;justify-content:center;overflow:hidden;margin-bottom:8px;text-decoration:none}
.imgbox img{width:100%;height:100%;object-fit:contain}
.imgbox .noimg{color:#8a8f99;font-size:14px}
.name{font-size:16px;font-weight:600;margin:0 0 6px}
.grid{display:grid;grid-template-columns:auto 1fr;gap:2px 14px;font-size:15px;align-items:baseline}
.grid dt{color:var(--muted)}
.grid dd{margin:0;font-variant-numeric:tabular-nums;word-break:break-all}
.price{font-size:22px;font-weight:700}
.badge{border-radius:12px;padding:8px 12px;margin-top:8px}
.badge .t{font-size:13px;font-weight:700;letter-spacing:.4px}
.badge .v{font-size:20px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums}
.badge .s{font-size:14px;margin-top:2px}
.badge.eoss{background:var(--eoss-bg);color:var(--eoss)}
.badge.pc{background:var(--pc-bg);color:var(--pc)}
.strike{text-decoration:line-through;color:var(--muted);font-weight:500;font-size:16px}
.msg{text-align:center;color:var(--muted);padding:28px 8px}
.msg.err{color:var(--eoss)}
.list{list-style:none;margin:0;padding:0}
.list li{border-top:1px solid var(--line)}
.list li:first-child{border-top:0}
.list button{width:100%;text-align:left;border:0;background:transparent;color:var(--text);padding:10px 2px;font-size:15px;display:flex;justify-content:space-between;gap:10px}
.list .sub{color:var(--muted);font-size:13px}
.sectiontitle{font-size:13px;color:var(--muted);font-weight:600;margin:18px 4px 8px;display:flex;justify-content:space-between}
.sectiontitle button{border:0;background:none;color:var(--muted);font-size:13px}
.data-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-top:1px solid var(--line);font-size:15px}
.data-row:first-of-type{border-top:0}
.data-row .st{color:var(--muted);font-size:13px;text-align:right}
.data-row .st.ok{color:var(--ok)}
.hint{font-size:13px;color:var(--muted);margin:10px 0 0}
.hidden{display:none!important}
/* scanner */
#scanner{position:fixed;inset:0;background:#000;z-index:50;display:flex;flex-direction:column}
#scanner video{flex:1;width:100%;object-fit:cover}
#scanner .frame{position:absolute;left:8%;right:8%;top:36%;height:24%;border:3px solid rgba(255,255,255,.9);border-radius:14px;box-shadow:0 0 0 9999px rgba(0,0,0,.35);pointer-events:none;transition:border-color .15s}
#scanner .frame.hit{border-color:#22c55e}
#scanner .zoom{position:absolute;left:0;right:0;top:calc(62% + 12px);display:flex;justify-content:center;gap:10px}
#scanner .zoom button{background:rgba(0,0,0,.55);color:#fff;border:1px solid rgba(255,255,255,.5);border-radius:20px;font-size:14px;font-weight:600;padding:7px 14px}
#scanner .zoom button.on{background:#fff;color:#000}
#scanner .bar p.tip{font-size:12px;opacity:.8;text-align:center}
#scanner .bar{position:absolute;left:0;right:0;bottom:0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px;align-items:center}
#scanner .bar p{color:#fff;margin:0;font-size:14px;text-shadow:0 1px 2px #000}
#scanner .bar button{background:#fff;color:#000;border:0;border-radius:12px;font-size:16px;font-weight:600;padding:14px;width:100%;max-width:400px}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:rgba(20,20,24,.92);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:60;max-width:90%;text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Stock Lookup</h1>
    <div class="hdr-r">
      <div class="lang" id="langBox"><button data-lang="en">EN</button><button data-lang="ja">日</button><button data-lang="ko">한</button></div>
      <button class="iconbtn" id="btnData" data-i18n="data">데이터</button>
    </div>
  </header>

  <div class="tabs" role="tablist">
    <button id="tabBarcode" class="on" role="tab">Barcode → Picture</button>
    <button id="tabSku" role="tab">SKU → Picture</button>
  </div>

  <form class="search" id="searchForm" autocomplete="off">
    <input id="q" inputmode="numeric" enterkeyhint="search" placeholder="" autocapitalize="characters" spellcheck="false">
    <button type="button" class="btn" id="btnScan" data-i18n="scan">스캔</button>
    <button type="submit" class="btn ghost" id="btnGo" data-i18n="go">조회</button>
  </form>

  <div id="result"></div>

  <div id="recentBox" class="hidden">
    <div class="sectiontitle"><span data-i18n="recent">최근 조회</span><button id="btnClearRecent" data-i18n="clear">지우기</button></div>
    <div class="card" style="padding:4px 14px"><ul class="list" id="recent"></ul></div>
  </div>

  <!-- data panel -->
  <div id="dataPanel" class="hidden">
    <div class="sectiontitle"><span data-i18n="dataTitle">데이터 (이 아이폰에만 저장됨)</span></div>
    <div class="card">
      <div class="data-row"><span data-i18n="master">마스터 (Barcode Transducer)</span><span class="st" id="stMaster">없음</span></div>
      <div class="data-row"><span data-i18n="eossList">EOSS 리스트</span><span class="st" id="stEoss">없음</span></div>
      <div class="data-row"><span><span data-i18n="priceList">가격변경 리스트</span> <span class="sub" style="color:var(--muted);font-size:12px" data-i18n="optional">(선택)</span></span><span class="st" id="stPrice">없음</span></div>
      <div style="margin-top:12px;display:grid;gap:8px">
        <button class="btn wide" id="btnLoad" data-i18n="load">CSV 불러오기</button>
        <button class="btn ghost wide" id="btnWipe" data-i18n="wipe">저장된 데이터 모두 삭제</button>
      </div>
      <p class="hint" data-i18n="hint">처음 한 번 파일을 고르면 이 아이폰 안에 저장되어, 다음부터는 바로 조회됩니다. 새 마스터/EOSS가 나오면 다시 고르세요 (같은 종류는 덮어씀). 여러 파일을 한 번에 골라도 되고, 종류는 내용을 보고 자동으로 구분합니다. 파일은 어디에도 전송되지 않습니다.</p>
    </div>
  </div>
  <input type="file" id="file" accept=".csv,text/csv,text/plain" multiple class="hidden">
</div>

<div id="scanner" class="hidden">
  <video id="video" playsinline muted></video>
  <div class="frame" id="frame"></div>
  <div class="zoom hidden" id="zoomBox"></div>
  <div class="bar">
    <p id="scanStatus">카메라 준비 중…</p>
    <p class="tip" data-i18n="tip"></p>
    <button id="btnStopScan" data-i18n="close">닫기</button>
  </div>
</div>
<div id="toast" class="hidden"></div>

<script src="barcode.js"></script>
<script>
"use strict";
const IMG_BASE = "https://jp.pandora.net/dw/image/v2/BKNF_PRD/on/demandware.static/-/Sites-pandora-master-catalog/default/productimages/main_rect_center/";
const IMG_TAIL = "_RGB.jpg?q=70&sfrm=png&bgcolor=FFFFFF&sw=810";

const $ = id => document.getElementById(id);
const state = { mode: "barcode", master: null, eoss: null, price: null };

/* ---------- i18n ---------- */
const I18N = {
  ko: {
    data:"데이터", scan:"스캔", go:"조회", recent:"최근 조회", clear:"지우기",
    dataTitle:"데이터 (이 아이폰에만 저장됨)", master:"마스터 (Barcode Transducer)", eossList:"EOSS 리스트",
    priceList:"가격변경 리스트", optional:"(선택)", load:"CSV 불러오기", wipe:"저장된 데이터 모두 삭제",
    hint:"처음 한 번 파일을 고르면 이 아이폰 안에 저장되어, 다음부터는 바로 조회됩니다. 새 마스터/EOSS가 나오면 다시 고르세요 (같은 종류는 덮어씀). 여러 파일을 한 번에 골라도 되고, 종류는 내용을 보고 자동으로 구분합니다. 파일은 어디에도 전송되지 않습니다.",
    tip:"바코드를 네모 안에 가로로 맞춰주세요. 흐리면 폰을 조금 떨어뜨리세요", close:"닫기",
    phBarcode:"바코드 입력", phSku:"SKU 입력 (예: 792136)",
    none:"없음", rows:"건", noImg:"이미지 없음", notInMaster:"마스터에 없음", current:"현재",
    kMaster:"마스터", kEoss:"EOSS", kPrice:"가격변경",
    firstRun:"처음 한 번, [CSV 불러오기]로 master.csv와 eoss.csv를 골라주세요.",
    noMaster:"마스터 파일이 없습니다. [CSV 불러오기]로 넣어주세요.",
    unknownFile:"파일 종류를 알 수 없어요", saveFail:"저장 실패", loaded:"불러옴",
    barcode:"바코드", wipeConfirm:"이 기기에 저장된 CSV 데이터를 모두 삭제할까요?", wiped:"데이터를 삭제했습니다.",
    camPrep:"카메라 준비 중…", engineLoad:"스캐너 불러오는 중…", scanning:"인식 중…", scanErr:"스캐너 오류",
    zoomFail:"줌 실패", noCam:"이 브라우저는 카메라를 지원하지 않아요 (https 주소로 열어야 해요)",
    camDenied:"카메라 권한을 허용해 주세요 (설정 > Safari > 카메라)", scanStartFail:"스캔을 시작할 수 없어요"
  },
  ja: {
    data:"データ", scan:"スキャン", go:"検索", recent:"最近の検索", clear:"クリア",
    dataTitle:"データ（このiPhoneにのみ保存）", master:"マスター (Barcode Transducer)", eossList:"EOSSリスト",
    priceList:"価格変更リスト", optional:"（任意）", load:"CSVを読み込む", wipe:"保存データをすべて削除",
    hint:"最初に一度ファイルを選ぶとこのiPhone内に保存され、次回からすぐ検索できます。新しいマスター/EOSSが出たら選び直してください（同じ種類は上書き）。複数ファイルを同時に選択でき、種類は内容から自動判別します。ファイルはどこにも送信されません。",
    tip:"バーコードを枠内に横向きで合わせてください。ぼやける場合は少し離してください", close:"閉じる",
    phBarcode:"バーコードを入力", phSku:"SKUを入力（例: 792136）",
    none:"なし", rows:"件", noImg:"画像なし", notInMaster:"マスターにありません", current:"現在",
    kMaster:"マスター", kEoss:"EOSS", kPrice:"価格変更",
    firstRun:"最初に一度、[CSVを読み込む]で master.csv と eoss.csv を選んでください。",
    noMaster:"マスターファイルがありません。[CSVを読み込む]で追加してください。",
    unknownFile:"ファイルの種類がわかりません", saveFail:"保存失敗", loaded:"読み込み完了",
    barcode:"バーコード", wipeConfirm:"この端末に保存されたCSVデータをすべて削除しますか？", wiped:"データを削除しました。",
    camPrep:"カメラ準備中…", engineLoad:"スキャナー読み込み中…", scanning:"読み取り中…", scanErr:"スキャナーエラー",
    zoomFail:"ズーム失敗", noCam:"このブラウザはカメラに対応していません（httpsで開いてください）",
    camDenied:"カメラへのアクセスを許可してください（設定 > Safari > カメラ）", scanStartFail:"スキャンを開始できません"
  },
  en: {
    data:"Data", scan:"Scan", go:"Search", recent:"Recent", clear:"Clear",
    dataTitle:"Data (stored on this iPhone only)", master:"Master (Barcode Transducer)", eossList:"EOSS list",
    priceList:"Price change list", optional:"(optional)", load:"Load CSV", wipe:"Delete all saved data",
    hint:"Pick the files once and they are saved on this iPhone, so lookups work right away next time. When a new master/EOSS comes out, pick it again (same type is overwritten). You can select several files at once; the type is detected from the content. Files are never uploaded anywhere.",
    tip:"Hold the barcode horizontally inside the box. If blurry, move the phone back a little", close:"Close",
    phBarcode:"Enter barcode", phSku:"Enter SKU (e.g. 792136)",
    none:"None", rows:" rows", noImg:"No image", notInMaster:"Not in master", current:"now",
    kMaster:"Master", kEoss:"EOSS", kPrice:"Price change",
    firstRun:"First time: tap [Load CSV] and pick master.csv and eoss.csv.",
    noMaster:"No master file. Add it with [Load CSV].",
    unknownFile:"unknown file type", saveFail:"Save failed", loaded:"Loaded",
    barcode:"Barcode", wipeConfirm:"Delete all CSV data saved on this device?", wiped:"Data deleted.",
    camPrep:"Starting camera…", engineLoad:"Loading scanner…", scanning:"Scanning…", scanErr:"Scanner error",
    zoomFail:"Zoom failed", noCam:"This browser can't use the camera (open the https address)",
    camDenied:"Please allow camera access (Settings > Safari > Camera)", scanStartFail:"Can't start scanning"
  }
};
function pickLang(){
  try{ const v = localStorage.getItem("lang"); if (I18N[v]) return v; }catch{}
  return "en";   // default language
}
let LANG = pickLang();
const t = k => (I18N[LANG] && I18N[LANG][k]) ?? I18N.ko[k] ?? k;
let lastView = null;   // { kind:"lookup", q, mode } | { kind:"msg", key, err } — re-rendered when language changes
function applyLang(){
  document.documentElement.lang = LANG;
  document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll("#langBox button").forEach(b => b.classList.toggle("on", b.dataset.lang === LANG));
  $("q").placeholder = state.mode === "barcode" ? t("phBarcode") : t("phSku");
  setStatus();
  if (lastView && lastView.kind === "lookup"){ const m = state.mode; state.mode = lastView.mode; lookup(lastView.q, true); state.mode = m; }
  else if (lastView && lastView.kind === "msg") showMsgKey(lastView.key, lastView.err);
}
function setLang(l){ LANG = l; try{ localStorage.setItem("lang", l); }catch{} applyLang(); }

/* ---------- utils ---------- */
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const yen = n => (n === null || n === undefined || n === "" || isNaN(n)) ? "-" : "¥" + Math.round(Number(n)).toLocaleString("ja-JP");
const skuBase = sku => String(sku || "").split("-")[0].trim();
const imgUrl = sku => IMG_BASE + encodeURIComponent(skuBase(sku)) + IMG_TAIL;
const normSku = s => String(s || "").trim().toUpperCase();
function toast(msg, ms = 2200){ const t = $("toast"); t.textContent = msg; t.classList.remove("hidden"); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.add("hidden"), ms); }
function num(v){ if (v === undefined || v === null) return NaN; const s = String(v).replace(/[¥￥,\s"]/g, ""); return s === "" ? NaN : Number(s); }

/* CSV parser (quotes, BOM, CRLF) */
function parseCSV(text){
  if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
  const rows = []; let row = [], f = "", q = false;
  for (let i = 0; i < text.length; i++){
    const c = text[i];
    if (q){
      if (c === '"'){ if (text[i+1] === '"'){ f += '"'; i++; } else q = false; }
      else f += c;
    } else if (c === '"') q = true;
    else if (c === ","){ row.push(f); f = ""; }
    else if (c === "\n" || c === "\r"){
      if (c === "\r" && text[i+1] === "\n") i++;
      row.push(f); f = ""; if (row.length > 1 || row[0] !== "") rows.push(row); row = [];
    } else f += c;
  }
  if (f !== "" || row.length){ row.push(f); rows.push(row); }
  return rows;
}

/* ---------- detect & build indexes ---------- */
function detectType(rows){
  const h = (rows[0] || []).map(x => String(x).trim().toLowerCase());
  const joined = h.join("|");
  if (h.includes("itemid") || /eoss/.test(joined)) return "eoss";
  if (/lrrp/.test(joined) || (joined.includes("current") && joined.includes("new"))) return "price";
  const first = String((rows[0] || [])[0] || "").trim();
  const second = String((rows[1] || [])[0] || "").trim();
  if (/^\d{8,14}$/.test(first) || /^\d{8,14}$/.test(second)) return "master";
  return null;
}

function buildMaster(rows){
  // Barcode, SKU, Name, Category, Price, Flag  (name may contain unquoted commas)
  const byBarcode = new Map(), bySku = new Map(), list = [];
  for (const r of rows){
    const bc = String(r[0] || "").trim();
    if (!/^\d{6,14}$/.test(bc)) continue; // skips header rows
    let name, cat, price;
    if (r.length > 6){ name = r.slice(2, r.length - 3).join(","); cat = r[r.length - 3]; price = r[r.length - 2]; }
    else { name = r[2]; cat = r[3]; price = r[4]; }
    const rec = { barcode: bc, sku: String(r[1] || "").trim(), name: String(name || "").trim(), cat: String(cat || "").trim(), price: num(price) };
    byBarcode.set(bc, rec);
    const k = normSku(rec.sku);
    if (!bySku.has(k)) bySku.set(k, rec);
    list.push(rec);
  }
  return { byBarcode, bySku, list, count: list.length };
}

function parseRate(v){
  const s = String(v ?? "").trim();
  if (!s) return { rate: NaN, label: "" };
  const m = s.match(/(\d+(?:\.\d+)?)\s*%/g);
  if (m){ const last = m[m.length - 1]; return { rate: parseFloat(last) / 100, label: s }; }
  const n = Number(s);
  if (!isNaN(n)) { const r = n > 1 ? n / 100 : n; return { rate: r, label: Math.round(r * 100) + "%" }; }
  return { rate: NaN, label: s };
}

function buildEoss(rows){
  const h = rows[0].map(x => String(x).trim().toLowerCase());
  let iId = h.indexOf("itemid"); if (iId < 0) iId = 0;
  const iRate = h.length - 1; // last column = season discount (e.g. "26S JP")
  const season = String(rows[0][iRate] || "").trim();
  const map = new Map();
  for (let i = 1; i < rows.length; i++){
    const r = rows[i]; const id = normSku(r[iId]); if (!id) continue;
    if (!map.has(id)) map.set(id, parseRate(r[iRate]));
  }
  return { map, season, count: map.size };
}

function buildPrice(rows){
  const h = rows[0].map(x => String(x).trim().toLowerCase());
  const find = (re, d) => { const i = h.findIndex(x => re.test(x)); return i < 0 ? d : i; };
  const iDv = find(/^dv$|design/, 1), iSku = find(/^sku$/, 2);
  const iCur = find(/current/, 3), iNew = find(/new/, 4);
  const map = new Map();
  for (let i = 1; i < rows.length; i++){
    const r = rows[i];
    const cur = num(r[iCur]), neu = num(r[iNew]);
    if (isNaN(cur) && isNaN(neu)) continue;
    const rec = { cur, neu };
    for (const key of [r[iDv], r[iSku]]){
      const k = normSku(key); if (!k) continue;
      if (!map.has(k)) map.set(k, rec);
      const b = normSku(skuBase(k)); if (b && !map.has(b)) map.set(b, rec);
    }
  }
  return { map, count: map.size };
}

const builders = { master: buildMaster, eoss: buildEoss, price: buildPrice };

/* ---------- IndexedDB ---------- */
function db(){
  return new Promise((res, rej) => {
    const r = indexedDB.open("stock-lookup", 1);
    r.onupgradeneeded = () => r.result.createObjectStore("files");
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
}
async function dbDo(mode, fn){
  const d = await db();
  return new Promise((res, rej) => {
    const tx = d.transaction("files", mode); const st = tx.objectStore("files");
    const req = fn(st); tx.oncomplete = () => res(req && req.result); tx.onerror = () => rej(tx.error);
  });
}
const dbPut = (k, v) => dbDo("readwrite", s => s.put(v, k));
const dbGet = k => dbDo("readonly", s => s.get(k));
const dbClear = () => dbDo("readwrite", s => s.clear());

/* ---------- loading ---------- */
function setStatus(){
  const fmt = (x, label) => x ? `${x.count.toLocaleString()}${t("rows")} · ${x.date}` : label;
  for (const [k, id] of [["master","stMaster"],["eoss","stEoss"],["price","stPrice"]]){
    const el = $(id), v = state[k];
    el.textContent = fmt(v, t("none")); el.classList.toggle("ok", !!v);
  }
}
function ingest(type, text, meta){
  const rows = parseCSV(text);
  const built = builders[type](rows);
  built.date = meta.date; built.name = meta.name;
  state[type] = built;
  return built;
}
async function loadSaved(){
  try{
    for (const k of ["master","eoss","price"]){
      const v = await dbGet(k);
      if (v && v.text) ingest(k, v.text, v);
    }
  }catch(e){ console.warn(e); }
  setStatus();
  if (!state.master){ $("dataPanel").classList.remove("hidden"); showMsgKey("firstRun"); }
}

async function onFiles(files){
  const done = [];
  for (const f of files){
    const text = await f.text();
    const rows = parseCSV(text.slice(0, 4000));
    const type = detectType(rows);
    if (!type){ toast(`${f.name}: ${t("unknownFile")}`); continue; }
    const now = new Date(); const date = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,"0")}-${String(now.getDate()).padStart(2,"0")}`;
    const meta = { name: f.name, date };
    const built = ingest(type, text, meta);
    try{ await dbPut(type, { text, ...meta }); }catch(e){ toast(t("saveFail") + ": " + e.message); }
    done.push(`${t({master:"kMaster",eoss:"kEoss",price:"kPrice"}[type])} ${built.count.toLocaleString()}${t("rows")}`);
  }
  setStatus();
  if (done.length) toast(t("loaded") + ": " + done.join(", "), 3000);
  if (state.master && $("result").querySelector(".msg")){ $("result").innerHTML = ""; lastView = null; }
}

/* ---------- lookup & render ---------- */
function showMsg(text, err){ $("result").innerHTML = `<div class="msg${err ? " err" : ""}">${esc(text)}</div>`; }
function showMsgKey(key, err){ lastView = { kind: "msg", key, err }; showMsg(t(key), err); }

function eossInfo(sku, price){
  if (!state.eoss || !sku) return null;
  const e = state.eoss.map.get(normSku(sku));
  if (!e) return null;
  const sale = (!isNaN(e.rate) && !isNaN(price)) ? price * (1 - e.rate) : NaN;
  return { label: e.label, sale };
}
function priceInfo(sku){
  if (!state.price || !sku) return null;
  const b = normSku(skuBase(sku));
  const p = state.price.map.get(b) || state.price.map.get(String(Number(b))) ;
  if (!p) return null;
  let diff = "";
  if (!isNaN(p.cur) && p.cur !== 0 && !isNaN(p.neu)){
    const d = p.neu - p.cur, pct = Math.round((p.neu / p.cur - 1) * 100);
    diff = `${d >= 0 ? "+" : "-"}${yen(Math.abs(d))}, ${pct >= 0 ? "+" : ""}${pct}%`;
  }
  return { cur: p.cur, neu: p.neu, diff };
}

function render(rec, skuInput, quiet){
  const sku = rec ? rec.sku : skuInput;
  const url = imgUrl(sku);
  const e = eossInfo(sku, rec ? rec.price : NaN);
  const p = priceInfo(sku);
  const html = `
  <div class="card">
    <a class="imgbox" href="${esc(url)}" target="_blank" rel="noopener">
      <img src="${esc(url)}" alt="" onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'noimg',textContent:'${esc(t("noImg"))}'}))">
    </a>
    <p class="name">${rec ? esc(rec.name) : `<span style="color:var(--eoss)">${esc(t("notInMaster"))}</span>`}</p>
    <dl class="grid">
      <dt>SKU</dt><dd>${esc(sku)}</dd>
      <dt>Barcode</dt><dd>${rec ? esc(rec.barcode) : "NOT FOUND"}</dd>
      <dt>Category</dt><dd>${rec ? esc(rec.cat) : "-"}</dd>
      <dt>Price</dt><dd class="price">${!rec ? "-" : (e && !isNaN(e.sale)) ? `<span class="strike">${yen(rec.price)}</span>` : yen(rec.price)}</dd>
    </dl>
    ${e ? `<div class="badge eoss"><div class="t">EOSS ↓ ${esc(e.label)}</div><div class="v">${yen(e.sale)}</div></div>` : ""}
    ${p ? `<div class="badge pc"><div class="t">PRICE CHANGE ↓</div><div class="v">${yen(p.neu)}</div>${p.diff ? `<div class="s">${esc(p.diff)} (${esc(t("current"))} ${yen(p.cur)})</div>` : ""}</div>` : ""}
  </div>`;
  $("result").innerHTML = html;
  if (!quiet) addRecent(sku, rec ? rec.name : "");
}

function lookup(raw, quiet){
  const q = String(raw || "").trim();
  if (!q) return;
  if (!state.master){ $("dataPanel").classList.remove("hidden"); showMsgKey("noMaster", true); return; }
  lastView = { kind: "lookup", q, mode: state.mode };
  if (state.mode === "barcode"){
    const d = q.replace(/\D/g, "");
    let rec = state.master.byBarcode.get(d);
    if (!rec && d.length === 12) rec = state.master.byBarcode.get("0" + d);   // UPC-A → EAN-13
    if (!rec && d.length === 13 && d[0] === "0") rec = state.master.byBarcode.get(d.slice(1));
    if (!rec){ showMsg(`${t("barcode")} ${d} : NOT FOUND`, true); return; }
    render(rec, null, quiet);
  } else {
    const k = normSku(q);
    const rec = state.master.bySku.get(k);
    if (rec){ render(rec, null, quiet); return; }
    const hits = state.master.list.filter(r => normSku(r.sku).startsWith(k)).slice(0, 40);
    if (hits.length === 1){ render(hits[0], null, quiet); return; }
    if (hits.length){
      $("result").innerHTML = `<div class="card" style="padding:4px 14px"><ul class="list">${hits.map(r =>
        `<li><button data-sku="${esc(r.sku)}"><span>${esc(r.sku)}</span><span class="sub">${esc(r.name)}</span></button></li>`).join("")}</ul></div>`;
      return;
    }
    render(null, q, quiet); // not in master: still show picture like the Excel sheet
  }
}

/* ---------- recent ---------- */
function getRecent(){ try{ return JSON.parse(localStorage.getItem("recent") || "[]"); }catch{ return []; } }
function addRecent(sku, name){
  if (!sku) return;
  const list = getRecent().filter(x => x.sku !== sku); list.unshift({ sku, name });
  try{ localStorage.setItem("recent", JSON.stringify(list.slice(0, 15))); }catch{}
  drawRecent();
}
function drawRecent(){
  const list = getRecent();
  $("recentBox").classList.toggle("hidden", !list.length);
  $("recent").innerHTML = list.map(x => `<li><button data-sku="${esc(x.sku)}"><span>${esc(x.sku)}</span><span class="sub">${esc(x.name)}</span></button></li>`).join("");
}
function openSku(sku){ setMode("sku"); $("q").value = sku; lookup(sku); window.scrollTo({ top: 0, behavior: "smooth" }); }

/* ---------- mode ---------- */
function setMode(m){
  state.mode = m;
  $("tabBarcode").classList.toggle("on", m === "barcode");
  $("tabSku").classList.toggle("on", m === "sku");
  const q = $("q");
  q.placeholder = m === "barcode" ? t("phBarcode") : t("phSku");
  q.inputMode = m === "barcode" ? "numeric" : "text";
  $("btnScan").classList.toggle("hidden", m !== "barcode");
}

/* ---------- scanner ---------- */
// Engine: ZXing-C++ compiled to WebAssembly (barcode.js + zxing_reader.wasm, both served from this site).
const SCAN_FORMATS = ["ean_13", "ean_8", "upc_a", "upc_e", "code_128", "code_39", "itf", "qr_code"];
let detector = null, scanning = false, scanStream = null, scanTimer = null, scanFrames = 0;
const scanCanvas = document.createElement("canvas");
const scanCtx = scanCanvas.getContext("2d", { willReadFrequently: true });

function getDetector(){
  if (detector) return detector;
  const api = window.BarcodeDetectionAPI;
  if (!api) throw new Error("barcode.js failed to load");
  api.prepareZXingModule({
    overrides: { locateFile: (path, prefix) => path.endsWith(".wasm") ? new URL("zxing_reader.wasm", location.href).href : prefix + path },
    fireImmediately: true
  });
  detector = new api.BarcodeDetector({ formats: SCAN_FORMATS });
  return detector;
}
function scanSay(t){ $("scanStatus").textContent = t; }

// Map the on-screen guide box (video uses object-fit:cover) to source-pixel coordinates.
function guideRect(v){
  const vw = v.videoWidth, vh = v.videoHeight, W = v.clientWidth, H = v.clientHeight;
  const s = Math.max(W / vw, H / vh);
  const offX = (W - vw * s) / 2, offY = (H - vh * s) / 2;
  const fr = $("frame").getBoundingClientRect(), vr = v.getBoundingClientRect();
  const padX = fr.width * 0.08, padY = fr.height * 0.35;          // a little extra margin around the box
  let x = (fr.left - vr.left - padX - offX) / s, y = (fr.top - vr.top - padY - offY) / s;
  let w = (fr.width + padX * 2) / s, h = (fr.height + padY * 2) / s;
  x = Math.max(0, x); y = Math.max(0, y); w = Math.min(vw - x, w); h = Math.min(vh - y, h);
  return { x, y, w, h };
}

async function scanTick(){
  if (!scanning) return;
  const v = $("video");
  try{
    if (v.readyState >= 2 && v.videoWidth){
      scanFrames++;
      // every 4th frame try the full picture, otherwise only the guide box (faster + sharper)
      const r = (scanFrames % 4 === 0) ? { x: 0, y: 0, w: v.videoWidth, h: v.videoHeight } : guideRect(v);
      scanCanvas.width = Math.round(r.w); scanCanvas.height = Math.round(r.h);
      scanCtx.drawImage(v, r.x, r.y, r.w, r.h, 0, 0, scanCanvas.width, scanCanvas.height);
      const found = await detector.detect(scanCtx.getImageData(0, 0, scanCanvas.width, scanCanvas.height));
      if (!scanning) return;
      if (found && found.length){
        const text = found[0].rawValue;
        $("frame").classList.add("hit");
        setTimeout(() => { stopScan(); $("q").value = text; lookup(text); }, 150);
        return;
      }
      if (scanFrames % 10 === 0) scanSay(`${t("scanning")} (${v.videoWidth}×${v.videoHeight})`);
    }
  }catch(e){
    scanSay(t("scanErr") + ": " + (e.message || e));
  }
  scanTimer = setTimeout(scanTick, 60);
}

function setupZoom(track){
  const box = $("zoomBox"); box.innerHTML = ""; box.classList.add("hidden");
  const caps = track.getCapabilities ? track.getCapabilities() : {};
  try{ if (caps.focusMode && caps.focusMode.includes("continuous")) track.applyConstraints({ advanced: [{ focusMode: "continuous" }] }); }catch{}
  if (!caps.zoom) return;
  const levels = [1, 2, 3].filter(z => z >= (caps.zoom.min || 1) && z <= caps.zoom.max);
  if (levels.length < 2) return;
  const setZoom = async (z, btn) => {
    try{ await track.applyConstraints({ advanced: [{ zoom: z }] }); box.querySelectorAll("button").forEach(x => x.classList.toggle("on", x === btn)); }
    catch(e){ scanSay(t("zoomFail") + ": " + e.message); }
  };
  const DEFAULT_ZOOM = 2;
  const defZ = levels.includes(DEFAULT_ZOOM) ? DEFAULT_ZOOM : levels[levels.length - 1];
  let def = null;
  for (const z of levels){
    const b = document.createElement("button"); b.textContent = z + "x";
    b.onclick = () => setZoom(z, b);
    box.appendChild(b);
    if (z === defZ) def = b;
  }
  box.classList.remove("hidden");
  setZoom(defZ, def);
}

async function startScan(){
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){ toast(t("noCam")); return; }
  $("scanner").classList.remove("hidden"); $("frame").classList.remove("hit");
  scanSay(t("camPrep"));
  try{
    getDetector();
    scanStream = await navigator.mediaDevices.getUserMedia({
      audio: false,
      video: { facingMode: { ideal: "environment" }, width: { ideal: 1920 }, height: { ideal: 1080 } }
    });
    const v = $("video"); v.srcObject = scanStream; v.setAttribute("playsinline", ""); await v.play();
    setupZoom(scanStream.getVideoTracks()[0]);
    scanSay(t("engineLoad"));
    await detector.detect(new ImageData(8, 8));        // loads the wasm engine once
    scanSay(t("scanning"));
    scanning = true; scanFrames = 0; scanTick();
  }catch(e){
    stopScan();
    toast(e && e.name === "NotAllowedError" ? t("camDenied") : t("scanStartFail") + ": " + (e.message || e), 4000);
  }
}
function stopScan(){
  scanning = false; clearTimeout(scanTimer);
  if (scanStream){ scanStream.getTracks().forEach(t => t.stop()); scanStream = null; }
  const v = $("video"); v.srcObject = null;
  $("scanner").classList.add("hidden");
}

/* ---------- wire up ---------- */
$("tabBarcode").onclick = () => { setMode("barcode"); $("q").value = ""; };
document.querySelectorAll("#langBox button").forEach(b => b.onclick = () => setLang(b.dataset.lang));
$("tabSku").onclick = () => { setMode("sku"); $("q").value = ""; };
$("searchForm").onsubmit = ev => { ev.preventDefault(); $("q").blur(); lookup($("q").value); };
$("btnScan").onclick = startScan;
$("btnStopScan").onclick = stopScan;
$("btnData").onclick = () => $("dataPanel").classList.toggle("hidden");
$("btnLoad").onclick = () => $("file").click();
$("file").onchange = ev => { const fs = [...ev.target.files]; ev.target.value = ""; onFiles(fs); };
$("btnWipe").onclick = async () => {
  if (!confirm(t("wipeConfirm"))) return;
  await dbClear(); state.master = state.eoss = state.price = null; setStatus(); showMsgKey("wiped");
};
$("btnClearRecent").onclick = () => { try{ localStorage.removeItem("recent"); }catch{} drawRecent(); };
document.addEventListener("click", ev => { const b = ev.target.closest("button[data-sku]"); if (b) openSku(b.dataset.sku); });

setMode("barcode");
applyLang();
drawRecent();
loadSaved();
if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
</html>
